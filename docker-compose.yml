version: '3.8'

services:
  web:
    build: .
    container_name: n2g_backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: sentimen_backend_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sentimen_db}
      MYSQL_USER: ${DB_USERNAME:-sentimen_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sentimen_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s

volumes:
  db_data:
